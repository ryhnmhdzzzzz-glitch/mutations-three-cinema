<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mutations Three Cinema</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f5f5f5;font-family:Arial,sans-serif}.nav{height:72px;padding:0 6%;display:flex;align-items:center;gap:32px;border-bottom:1px solid #29292d;background:#09090bee;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;margin-right:auto;cursor:pointer}.logo{width:40px;height:40px;border-radius:11px;background:#e5b95d;color:#111;display:grid;place-items:center;font-weight:900}.brand b{display:block;font-size:14px}.brand span{display:block;color:#777;font-size:8px;letter-spacing:2px;margin-top:3px}nav{display:flex;gap:25px}nav a{color:#999;font-size:13px}.search{display:flex;align-items:center;background:#151519;border:1px solid #303036;border-radius:9px;padding:0 10px}.search input{width:145px;height:38px;background:none;border:0;outline:0;color:#fff}.gear{border:1px solid #333;background:#151519;color:#aaa;border-radius:9px;height:39px;width:39px;cursor:pointer}.hero{min-height:560px;max-width:1250px;margin:auto;padding:70px 6%;display:flex;align-items:center;justify-content:space-between}.eyebrow{font-size:10px;color:#e5b95d;letter-spacing:2px;font-weight:bold}.hero h1{font-size:60px;line-height:1;margin:15px 0;letter-spacing:-3px}.hero em{color:#e5b95d;font-style:normal}.hero p{color:#999;line-height:1.7;max-width:530px}.primary{background:#e5b95d;color:#111;border:0;border-radius:9px;padding:12px 18px;font-weight:bold;cursor:pointer}.featured{width:300px;height:405px;border-radius:17px;overflow:hidden;position:relative;box-shadow:0 25px 70px #000}.featured img,.poster img,.detail img{width:100%;height:100%;object-fit:cover}.caption{position:absolute;bottom:0;width:100%;padding:50px 20px 20px;background:linear-gradient(transparent,#000);display:flex;flex-direction:column;gap:5px}.caption span{color:#e5b95d;font-size:9px;letter-spacing:2px}.section{max-width:1250px;margin:auto;padding:20px 6% 80px}.section h2{font-size:28px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}.movie{cursor:pointer}.poster{height:275px;border-radius:11px;overflow:hidden;position:relative;background:#151519}.poster img{transition:.2s}.movie:hover .poster img{transform:scale(1.04)}.rating{position:absolute;right:7px;top:7px;background:#000c;padding:5px 7px;border-radius:6px;font-size:10px}.movie h3{font-size:14px;margin:10px 0 4px}.movie p{color:#777;font-size:11px;margin:0}.modal{position:fixed;inset:0;background:#000c;backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px;z-index:20}.box{background:#151519;border:1px solid #303036;border-radius:16px;padding:30px;max-width:760px;width:100%;max-height:90vh;overflow:auto;position:relative}.close{position:absolute;right:13px;top:13px;background:#222228;border:1px solid #333;color:#bbb;border-radius:8px;width:35px;height:35px;cursor:pointer}.detail{display:grid;grid-template-columns:40% 60%;padding:0;overflow:hidden}.detail img{height:480px}.detail-info{padding:40px}.detail-info h2{font-size:35px}.detail-info p,.muted{color:#999;line-height:1.7}.field{width:100%;height:43px;background:#101014;border:1px solid #36363d;border-radius:8px;color:#fff;padding:0 12px;margin:7px 0 14px;outline:0}textarea.field{height:80px;padding:10px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:11px;color:#aaa}.tabs{display:flex;border-bottom:1px solid #333;margin:15px 0}.tabs button{background:none;border:0;color:#888;padding:12px 15px;cursor:pointer}.tabs .active{color:#e5b95d;border-bottom:2px solid #e5b95d}.adminrow{display:grid;grid-template-columns:45px 1fr auto auto;gap:10px;align-items:center;background:#101014;border:1px solid #29292e;border-radius:9px;padding:7px;margin:7px 0}.adminrow img{width:45px;height:55px;object-fit:cover;border-radius:5px}.adminrow small{display:block;color:#777;font-size:10px;margin-top:3px}.adminrow button{background:#222228;border:1px solid #333;color:#aaa;border-radius:7px;width:32px;height:32px;cursor:pointer}.danger{color:#e77!important}footer{border-top:1px solid #27272a;padding:30px 6%;color:#666;display:flex;justify-content:space-between;align-items:center}@media(max-width:900px){nav{display:none}.grid{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:48px}}@media(max-width:600px){.nav{padding:0 18px}.search{display:none}.hero{padding:45px 20px;flex-direction:column;align-items:flex-start;gap:35px}.hero h1{font-size:43px}.featured{width:100%;height:390px}.section{padding:20px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}.poster{height:250px}footer{padding:25px 20px;flex-wrap:wrap}.detail{grid-template-columns:1fr}.detail img{height:280px}.detail-info{padding:25px}.two{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
const seed=[
{id:1,title:"The Last Horizon",year:2026,genre:"Action",rating:8.7,poster:"https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=700&q=80",desc:"Sebuah perjalanan terakhir menuju dunia yang perlahan kehilangan harapan."},
{id:2,title:"Midnight City",year:2025,genre:"Crime",rating:8.3,poster:"https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=700&q=80",desc:"Malam panjang, rahasia besar, dan satu keputusan yang mengubah segalanya."},
{id:3,title:"Beyond The Stars",year:2026,genre:"Sci-Fi",rating:9.1,poster:"https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=700&q=80",desc:"Petualangan menuju tempat yang belum pernah disentuh manusia."},
{id:4,title:"Shadow House",year:2024,genre:"Horror",rating:8.1,poster:"https://images.unsplash.com/photo-1505635552518-3448ff116af3?auto=format&fit=crop&w=700&q=80",desc:"Rumah tua itu kosong selama bertahun-tahun."},
{id:5,title:"Ocean Memories",year:2025,genre:"Drama",rating:8.5,poster:"https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=700&q=80",desc:"Sebuah kisah tentang keluarga, kehilangan, dan pulang."},
{id:6,title:"Velocity",year:2026,genre:"Action",rating:8.8,poster:"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80",desc:"Kecepatan adalah satu-satunya jalan untuk menyelamatkan mereka."}];
let movies=JSON.parse(localStorage.getItem("m3movies")||"null")||seed;
let brand=JSON.parse(localStorage.getItem("m3brand")||"null")||{name:"Mutations Three Cinema",tag:"PRIVATE CINEMA",pin:"1234"};
let query="";
function save(){localStorage.setItem("m3movies",JSON.stringify(movies));localStorage.setItem("m3brand",JSON.stringify(brand));}
function render(){
 document.title=brand.name;
 const list=movies.filter(m=>(m.title+" "+m.genre).toLowerCase().includes(query.toLowerCase()));
 document.getElementById("app").innerHTML=`<header class="nav"><div class="brand" onclick="scrollTo(0,0)"><div class="logo">M3</div><div><b>${brand.name}</b><span>${brand.tag}</span></div></div><nav><a>Beranda</a><a>Film</a><a>Genre</a></nav><div class="search">⌕<input placeholder="Cari film..." value="${query}" oninput="query=this.value;render()"></div><button class="gear" onclick="openSettings()">⚙</button></header><main><section class="hero"><div><div class="eyebrow">WELCOME TO YOUR PRIVATE CINEMA</div><h1>Watch something<br><em>extraordinary.</em></h1><p>Koleksi film pribadi dengan pengalaman menonton yang nyaman, elegan, dan sederhana.</p><button class="primary" onclick="detail(${movies[0]?.id})">▶ Mulai Menonton</button></div><div class="featured"><img src="${movies[2]?.poster||movies[0]?.poster}"><div class="caption"><span>FEATURED</span><b>${movies[2]?.title||""}</b><small>★ ${movies[2]?.rating||""} · ${movies[2]?.year||""}</small></div></div></section><section class="section"><div class="eyebrow">YOUR COLLECTION</div><h2>Film Pilihan</h2><div class="grid">${list.map(m=>`<article class="movie" onclick="detail(${m.id})"><div class="poster"><img src="${m.poster}"><span class="rating">★ ${m.rating}</span></div><h3>${m.title}</h3><p>${m.year} · ${m.genre}</p></article>`).join("")}</div></section></main><footer><div class="brand"><div class="logo">M3</div><div><b>${brand.name}</b><span>${brand.tag}</span></div></div><span>© 2026 ${brand.name}</span><button onclick="openSettings()">Pengaturan</button></footer>`;
}
function detail(id){const m=movies.find(x=>x.id===id);document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="pop" onclick="this.remove()"><div class="box detail" onclick="event.stopPropagation()"><button class="close" onclick="pop.remove()">×</button><img src="${m.poster}"><div class="detail-info"><div class="eyebrow">${m.genre} · ${m.year}</div><h2>${m.title}</h2><b style="color:#e5b95d">★ ${m.rating}</b><p>${m.desc}</p><button class="primary">▶ Tonton Sekarang</button></div></div></div>`)}
function openSettings(){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="settings"><div class="box"><button class="close" onclick="settings.remove()">×</button><div class="eyebrow">ADMIN AREA</div><h2>Pengaturan</h2><p class="muted">Masukkan PIN admin.</p><input class="field" id="pin" type="password" placeholder="PIN admin" onkeydown="if(event.key==='Enter')login()"><button class="primary" onclick="login()">Masuk</button></div></div>`)}
function login(){if(pin.value===brand.pin){settings.remove();adminPanel()}else alert("PIN salah.")}
function adminPanel(){document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="admin"><div class="box"><button class="close" onclick="admin.remove()">×</button><div class="eyebrow">CONTROL CENTER</div><h2>Admin Panel</h2><div class="tabs"><button class="active" onclick="movieTab()">Film</button><button onclick="siteTab()">Website</button></div><div id="panel"></div></div></div>`);movieTab()}
function movieTab(){panel.innerHTML=`<button class="primary" onclick="editor()">＋ Film Baru</button><div style="margin-top:15px">${movies.map(m=>`<div class="adminrow"><img src="${m.poster}"><div><b>${m.title}</b><small>${m.year} · ${m.genre} · ★ ${m.rating}</small></div><button onclick="editor(${m.id})">✎</button><button class="danger" onclick="removeMovie(${m.id})">🗑</button></div>`).join("")}</div>`}
function editor(id){const m=id?movies.find(x=>x.id===id):{title:"",year:2026,genre:"Action",rating:8,poster:"",desc:""};panel.innerHTML=`<h3>${id?"Edit Film":"Tambah Film"}</h3><label>Judul<input class="field" id="ft" value="${m.title}"></label><div class="two"><label>Tahun<input class="field" id="fy" value="${m.year}"></label><label>Genre<input class="field" id="fg" value="${m.genre}"></label></div><label>Rating<input class="field" id="fr" type="number" step=".1" value="${m.rating}"></label><label>URL Poster<input class="field" id="fp" value="${m.poster}"></label><label>Sinopsis<textarea class="field" id="fd">${m.desc}</textarea></label><button class="primary" onclick="saveMovie(${id||0})">Simpan Film</button> <button class="gear" onclick="movieTab()">Batal</button>`}
function saveMovie(id){const data={id:id||Date.now(),title:ft.value,year:Number(fy.value),genre:fg.value,rating:Number(fr.value),poster:fp.value,desc:fd.value};if(!data.title)return alert("Judul wajib diisi");if(id)movies=movies.map(m=>m.id===id?data:m);else movies.unshift(data);save();render();admin.remove();adminPanel()}
function removeMovie(id){if(confirm("Hapus film ini?")){movies=movies.filter(m=>m.id!==id);save();render();admin.remove();adminPanel()}}
function siteTab(){panel.innerHTML=`<label>Nama Website<input class="field" id="sn" value="${brand.name}"></label><label>Tagline<input class="field" id="st" value="${brand.tag}"></label><label>PIN Admin Baru<input class="field" id="sp" type="password" value="${brand.pin}"></label><button class="primary" onclick="brand.name=sn.value;brand.tag=st.value;brand.pin=sp.value;save();render();admin.remove()">Simpan Pengaturan</button>`}
render();
</script></body></html>
